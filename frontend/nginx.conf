server {
    listen 80;

    # Photo uploads: nginx's default limit is 1 MB
    client_max_body_size 10m;

    # React app (static files built by the first Dockerfile stage)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Unknown paths fall back to index.html so client-side routes survive a refresh
        try_files $uri /index.html;
    }

    # API: forwarded unchanged to the backend service (compose service name "backend").
    # No trailing slash after :8000, so /api/v1/... is passed through as-is.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded photos are served by the backend too
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
